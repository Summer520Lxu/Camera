<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 人臉分析儀</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; text-align: center; background: #2c3e50; color: white; }
        canvas { position: absolute; top: 0; left: 0; }
        .container { position: relative; display: inline-block; margin-top: 20px; }
        video { border-radius: 10px; background: #000; }
        .controls { margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #3498db; color: white; }
    </style>
</head>
<body>

    <h2>AI 人臉特徵分析 (年齡、性別、表情)</h2>
    
    <div class="controls">
        <button id="switchBtn">切換鏡頭</button>
    </div>

    <div class="container" id="container">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
    </div>

    <div id="status">正在初始化 AI 模型...</div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const switchBtn = document.getElementById('switchBtn');
        let currentFacingMode = 'user'; // 'user' 為前鏡頭, 'environment' 為後鏡頭

        // 1. 載入所有必要的 AI 模型
        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
                faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
            ]);
            status.innerText = "模型載入完成，啟動鏡頭中...";
            startVideo();
        }

        // 2. 啟動鏡頭
        async function startVideo() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("無法開啟鏡頭: ", err);
                status.innerText = "錯誤：無法存取鏡頭。";
            }
        }

        // 3. 切換鏡頭按鈕邏輯
        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startVideo();
        });

        // 4. 當影片開始播放，執行辨識
        video.addEventListener('play', () => {
            const canvas = faceapi.createCanvasFromMedia(video);
            document.getElementById('container').append(canvas);
            const displaySize = { width: video.width, height: video.height };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                // 偵測人臉、表情、年齡與性別
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions()
                    .withAgeAndGender();

                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                // 清除上一幀的畫布
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                
                // 繪製方框與結果
                faceapi.draw.drawDetections(canvas, resizedDetections);
                faceapi.draw.drawFaceExpressions(canvas, resizedDetections);
                
                resizedDetections.forEach(detection => {
                    const { age, gender, genderProbability } = detection;
                    new faceapi.draw.DrawTextField(
                        [
                            `${Math.round(age)} 歲`,
                            `${gender === 'male' ? '男性' : '女性'} (${Math.round(genderProbability * 100)}%)`
                        ],
                        detection.detection.box.bottomLeft
                    ).draw(canvas);
                });
                
                status.innerText = detections.length > 0 ? `偵測到 ${detections.length} 個人` : "尋找人臉中...";
            }, 200); // 每 0.2 秒掃描一次
        });

        loadModels();
    </script>
</body>
</html>
